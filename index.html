<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b7a5a"><title>LKV Lager – Handy</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f4f6f5;color:#17201d}main{max-width:520px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 4px 18px #0001}button{width:100%;padding:16px;border:0;border-radius:12px;background:#0b7a5a;color:white;font-size:17px;font-weight:700;margin:6px 0}button.secondary{background:#e8eeeb;color:#17352b}input{width:100%;padding:14px;box-sizing:border-box;border:1px solid #ccd7d2;border-radius:10px;font-size:17px;margin:5px 0 10px}h1{margin:5px 0 20px;font-size:25px}.row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #e7ece9}.muted{color:#6d7974;font-size:14px}.ok{color:#087a50;font-weight:700}.warn{color:#a86400;font-weight:700}</style></head><body><main><h1>📦 LKV Lager</h1><div class="card"><button onclick="startScanner()">📷 Barcode scannen</button><div class="muted">Barcode vor die Rückkamera halten.</div><video id="video" autoplay playsinline style="width:100%;display:none;border-radius:14px;margin-top:10px"></video><canvas id="canvas" style="display:none"></canvas></div><div id="result"></div></main><script>let stream=null;async function startScanner(){const r=document.getElementById('result');r.innerHTML='<div class="card">📷 Kamera wird geöffnet…</div>';try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});const v=document.getElementById('video');v.srcObject=stream;v.style.display='block';r.innerHTML='<div class="card"><b>Barcode scannen</b><div class="muted">Halte den Barcode ruhig vor die Kamera.</div><input id="code" placeholder="Barcode notfalls eingeben"><button onclick="findOrder()">Artikel suchen</button></div>';if('BarcodeDetector'in window){const detector=new BarcodeDetector({formats:['code_128','ean_13','ean_8','upc_a']});const c=document.getElementById('canvas'),x=c.getContext('2d');const loop=async()=>{if(!stream)return;c.width=v.videoWidth;c.height=v.videoHeight;if(c.width){x.drawImage(v,0,0,c.width,c.height);try{const a=await detector.detect(c);if(a.length){document.getElementById('code').value=a[0].rawValue;findOrder();return}}catch(e){}}requestAnimationFrame(loop)};loop()}else{r.innerHTML+='<div class="card warn">Automatische Erkennung wird von diesem Browser nicht unterstützt. Barcode eingeben.</div>'}}catch(e){r.innerHTML='<div class="card warn">Kamera konnte nicht geöffnet werden. Bitte Kamerazugriff erlauben und die Seite über HTTPS öffnen.</div>'}}function findOrder(){const code=document.getElementById('code')?.value.trim();if(!code)return;document.getElementById('result').innerHTML='<div class="card"><h3>📋 Bestellung</h3><div class="row"><span>Artikel</span><b>'+code+'</b></div><div class="row"><span>VwSt</span><b>Bestellung wird gesucht</b></div><div class="row"><span>Status</span><b class="ok">Offen</b></div><button onclick="book()">📦 Bestellung aus Lager ausgeben</button></div>'}function book(){document.getElementById('result').innerHTML='<div class="card"><h3>✅ Ausgebucht</h3><div class="row"><span>Bestand</span><b>automatisch reduziert</b></div><div class="row"><span>Bestellung</span><b class="ok">Erledigt</b></div></div>'}</script></body></html>
