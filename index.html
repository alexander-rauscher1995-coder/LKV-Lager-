<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1677ff"><title>LKV Lager – Handy</title><script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/index.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f3f6f5;color:#17201d;font-family:Arial,sans-serif}main{max-width:560px;margin:auto;padding:14px}.top{padding:10px 4px}.top h1{margin:0;font-size:25px}.muted{color:#66736e}.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 3px 14px #0001}.scan{background:#1677ff;color:#fff;border:0;border-radius:16px;width:100%;padding:19px;font-size:18px;font-weight:700;box-shadow:0 4px 12px #1677ff33}.stop{background:#b42318}.video{width:100%;border-radius:16px;background:#111;display:none;aspect-ratio:4/3;object-fit:cover;margin-top:12px}.code{font-size:20px;font-weight:700;word-break:break-all}.order{border:2px solid #e3e8e5;border-radius:14px;padding:14px;margin-top:10px}.row{display:flex;justify-content:space-between;gap:10px;margin:6px 0}.pill{padding:5px 9px;border-radius:999px;background:#fff4d6;color:#8a5a00;font-weight:700;font-size:13px}.issue{width:100%;border:0;border-radius:16px;background:#1677ff;color:#fff;padding:15px;font-weight:700;font-size:16px;margin-top:10px;box-shadow:0 4px 12px #1677ff33}.msg{padding:12px;border-radius:12px;background:#eef2f0;margin-top:10px}.small{font-size:13px}.hidden{display:none!important}.settings{margin-top:18px}.settings textarea{width:100%;min-height:120px;margin-top:10px;border:1px solid #ccd5d1;border-radius:10px;padding:10px;font-family:monospace}.settings button{width:100%;padding:12px;margin-top:8px;border:0;border-radius:10px;background:#26332e;color:#fff}</style></head><body><div id="loginScreen" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#f3f6f5"><div class="card" style="width:100%;max-width:430px"><h1 style="margin-top:0">📦 LKV Lager</h1><h2>Anmeldung</h2><input id="loginUser" autocomplete="username" placeholder="Benutzer" style="width:100%;padding:14px;border:1px solid #ccd5d1;border-radius:12px;font-size:16px;margin:6px 0"><input id="loginPass" type="password" autocomplete="current-password" placeholder="Passwort" style="width:100%;padding:14px;border:1px solid #ccd5d1;border-radius:12px;font-size:16px;margin:6px 0"><button type="button" class="scan" style="margin-top:8px" onclick="login()">Anmelden</button><div id="loginMsg" class="msg hidden"></div></div></div><main id="app" class="hidden"><div class="top"><h1>📦 LKV Lager</h1><div class="muted">Barcode scannen → VwSt → ausgeben</div></div><div class="card"><h2 style="margin:0 0 8px">📋 Offene VwSt-Bestellungen</h2><div id="openOrders" class="small muted">Keine Daten geladen.</div></div><div class="card"><button id="scanBtn" class="scan" onclick="startScan()">📷 Barcode scannen</button><div class="row" style="margin-top:10px"><input id="codeInput" inputmode="numeric" autocomplete="off" placeholder="Barcode eingeben" style="flex:1;padding:13px;border:1px solid #ccd5d1;border-radius:12px;font-size:16px"><button onclick="manualScan()" style="padding:13px;border:0;border-radius:12px;background:#26332e;color:#fff;font-weight:700">Suchen</button></div><button id="stopBtn" class="scan stop hidden" onclick="stopScan()">■ Scanner stoppen</button><video id="video" class="video" playsinline muted></video><div id="scanMsg" class="msg">Bereit zum Scannen.</div></div><div id="orderScanCard" class="card hidden"><h2 style="margin-top:0">📋 VwSt / Bestellung scannen</h2><button id="orderScanBtn" class="scan" onclick="startOrderScan()">📷 VwSt-/Bestell-Barcode scannen</button><button id="orderStopBtn" class="scan stop hidden" onclick="stopOrderScan()">■ Scanner stoppen</button><video id="orderVideo" class="video" playsinline muted></video><div id="orderScanMsg" class="msg">Nach dem Artikelscan hier die VwSt oder Bestellung scannen.</div></div><div id="result" class="card hidden"></div></main><script>
const USERS={Lager:{password:'lager',role:'Mitarbeiter'},Admin:{password:'admin',role:'Admin'}};
function login(){const u=$('loginUser').value.trim(),p=$('loginPass').value;const key=Object.keys(USERS).find(k=>k.toLowerCase()===u.toLowerCase());const user=key?USERS[key]:null;if(!user||user.password!==p){$('loginMsg').classList.remove('hidden');$('loginMsg').textContent='Benutzer oder Passwort falsch.';return}sessionStorage.setItem('lkv_user',key);sessionStorage.setItem('lkv_role',user.role);showApp()}
function showApp(){$('loginScreen').classList.add('hidden');$('app').classList.remove('hidden')}
function logout(){sessionStorage.removeItem('lkv_user');sessionStorage.removeItem('lkv_role');location.reload()}
document.addEventListener('DOMContentLoaded',()=>{if(sessionStorage.getItem('lkv_user'))showApp()});

const AKEY='lkv_v2_articles',OKEY='lkv_v2_orders',LKEY='lkv_v2_logs';let articles=JSON.parse(localStorage.getItem(AKEY)||'[]'),orders=JSON.parse(localStorage.getItem(OKEY)||'[]'),logs=JSON.parse(localStorage.getItem(LKEY)||'[]'),reader=null,stream=null,scanning=false,orderReader=null,orderStream=null,orderScanning=false,scannedArticle=null;
const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const now=()=>new Date().toLocaleString('de-DE');function save(){localStorage.setItem(AKEY,JSON.stringify(articles));localStorage.setItem(OKEY,JSON.stringify(orders));localStorage.setItem(LKEY,JSON.stringify(logs))}
function getZXing(){return window.ZXing||window.zxing||null}
async function startScan(){if(scanning)return;const ZX=getZXing();if(!ZX){$('scanMsg').textContent='Scanner-Bibliothek nicht geladen. Bitte Seite neu laden.';return}if(!navigator.mediaDevices?.getUserMedia){$('scanMsg').textContent='Dieser Browser unterstützt keinen Kamerazugriff.';return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});const video=$('video');video.srcObject=stream;video.style.display='block';await video.play();$('scanBtn').classList.add('hidden');$('stopBtn').classList.remove('hidden');$('scanMsg').textContent='Barcode vor die Kamera halten …';reader=new ZX.BrowserMultiFormatReader();scanning=true;reader.decodeFromVideoElement(video,(result,error)=>{if(result&&scanning){const code=result.getText();stopScan();showOrders(code)}})}catch(e){stopScan();$('scanMsg').textContent='Kamera konnte nicht gestartet werden. Bitte Kamerazugriff erlauben.';console.error(e)}}
function stopScan(){scanning=false;try{reader?.reset()}catch(e){}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('video').pause();$('video').srcObject=null;$('video').style.display='none';$('scanBtn').classList.remove('hidden');$('stopBtn').classList.add('hidden')}
function manualScan(){let code=$('codeInput').value.trim();if(!code){$('scanMsg').textContent='Bitte Barcode eingeben.';return}showOrders(code)}
function showOrders(code){$('codeInput').value=code;let article=articles.find(a=>String(a.barcode)===String(code)||String(a.nr)===String(code));scannedArticle=article;$('orderScanCard').classList.remove('hidden');let found=orders.filter(o=>o.status!=='Erledigt'&&o.items?.some(x=>{let a=articles.find(y=>y.id===x.articleId);return a&&(String(a.barcode)===String(code)||String(a.nr)===String(code))}));$('result').classList.remove('hidden');if(!found.length){$('result').innerHTML='<b>Keine offene Bestellung gefunden.</b><div class="msg">Barcode: <span class="code">'+esc(code)+'</span></div>';return}let h='<div class="muted">Gescannt</div><div class="code">'+esc(code)+'</div>'+(article?'<div class="order" style="border-color:#1677ff"><div class="row"><b>📦 '+esc(article.name)+'</b><span class="pill">Bestand</span></div><div class="row"><span>VKB</span><b>'+esc(article.vkb||article.nr||'-')+'</b></div><div class="row"><span>Bestand</span><b>'+Number(article.bestand||0)+' Stk.</b></div></div>':'')+'<h2>📋 Welche VwSt hat bestellt?</h2><div class="small muted">'+found.length+' offene Bestellung(en) gefunden</div>';found.forEach(o=>{let items=o.items.map(x=>{let a=articles.find(y=>y.id===x.articleId);return a?'<div class="row"><span>'+esc(a.name)+'<br><span class="small muted">'+esc(a.nr||'')+'</span></span><b>'+Number(x.qty)+' Stk.</b></div>':''}).join('');h+='<div class="order"><div class="row"><b>VwSt: '+esc(o.site)+'</b><span class="pill">Offen</span></div><div class="small muted">Bestellung '+esc(o.no||'-')+' · '+esc(o.date||'')+'</div>'+items+'<button class="issue" onclick="fulfillScanned('+o.id+',\''+String(code).replace(/'/g,'\\\'')+'\')">📦 Diese Bestellung aus Lager ausgeben</button></div>'});$('result').innerHTML=h}
async function startOrderScan(){if(orderScanning)return;const ZX=getZXing();if(!ZX){$('orderScanMsg').textContent='Scanner-Bibliothek nicht geladen. Bitte Seite neu laden.';return}if(!navigator.mediaDevices?.getUserMedia){$('orderScanMsg').textContent='Dieser Browser unterstützt keinen Kamerazugriff.';return}try{orderStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});const video=$('orderVideo');video.srcObject=orderStream;video.style.display='block';await video.play();$('orderScanBtn').classList.add('hidden');$('orderStopBtn').classList.remove('hidden');$('orderScanMsg').textContent='VwSt-/Bestell-Barcode vor die Kamera halten …';orderReader=new ZX.BrowserMultiFormatReader();orderScanning=true;orderReader.decodeFromVideoElement(video,(result,error)=>{if(result&&orderScanning){const code=result.getText();stopOrderScan();showOrder(code)}})}catch(e){stopOrderScan();$('orderScanMsg').textContent='Kamera konnte nicht gestartet werden. Bitte Kamerazugriff erlauben.';console.error(e)}}
function stopOrderScan(){orderScanning=false;try{orderReader?.reset()}catch(e){}if(orderStream){orderStream.getTracks().forEach(t=>t.stop());orderStream=null}$('orderVideo').pause();$('orderVideo').srcObject=null;$('orderVideo').style.display='none';$('orderScanBtn').classList.remove('hidden');$('orderStopBtn').classList.add('hidden')}
function showOrder(code){let o=orders.find(x=>String(x.no)===String(code)||String(x.barcode)===String(code)||String(x.orderBarcode)===String(code)||String(x.id)===String(code)||String(x.siteBarcode)===String(code));if(!o){$('orderScanMsg').textContent='Keine passende VwSt-/Bestellung gefunden: '+code;return}if(scannedArticle&&!o.items?.some(x=>x.articleId===scannedArticle.id)){$('orderScanMsg').textContent='Diese Bestellung enthält den gescannten Artikel nicht.';return}let line=scannedArticle?o.items.find(x=>x.articleId===scannedArticle.id):null;let offen=line?Math.max(0,Number(line.qty||0)-Number(line.issued||0)):0;$('orderScanMsg').innerHTML='<b>✅ Bestellung erkannt</b><br>VwSt: <b>'+esc(o.site)+'</b><br>Bestellung: '+esc(o.no||code)+(line?'<br>Artikel: '+esc(scannedArticle.name)+'<br>Bestellt: '+Number(line.qty||0)+' Stk.<br>Noch offen: <b>'+offen+' Stk.</b>':'');if(line&&offen>0){$('result').classList.remove('hidden');$('result').innerHTML='<div class="order" style="border-color:#1677ff"><div class="row"><b>📦 '+esc(scannedArticle.name)+'</b><span class="pill">Offen</span></div><div class="row"><span>VKB</span><b>'+esc(scannedArticle.vkb||scannedArticle.nr||'-')+'</b></div><div class="row"><span>VwSt</span><b>'+esc(o.site)+'</b></div><div class="row"><span>Bestellt</span><b>'+Number(line.qty||0)+' Stk.</b></div><div class="row"><span>Noch offen</span><b>'+offen+' Stk.</b></div><button class="issue" onclick="fulfillScanned('+o.id+',\''+String(scannedArticle.barcode||scannedArticle.nr||'').replace(/'/g,'\\\'')+'\')">📦 Aus Lager ausgeben</button></div>'}else if(line&&offen===0){$('result').classList.remove('hidden');$('result').innerHTML='<div class="msg">✅ Diese Artikelposition ist bereits vollständig ausgegeben.</div>'}}
function fulfillScanned(id,code){let o=orders.find(x=>x.id===id);if(!o||o.status==='Erledigt')return;let line=o.items?.find(x=>{let a=articles.find(y=>y.id===x.articleId);return a&&(String(a.barcode)===String(code)||String(a.nr)===String(code))});if(!line){$('scanMsg').textContent='Artikel nicht in dieser Bestellung.';return}let a=articles.find(y=>y.id===line.articleId);let bestellt=Number(line.qty)||0;let ausgegeben=Number(line.issued)||0;let offen=bestellt-ausgegeben;if(offen<=0){$('scanMsg').textContent='Diese Position ist bereits vollständig ausgegeben.';return}let menge=prompt('Wie viele Stück ausgeben? Maximal '+offen,String(offen));if(menge===null)return;menge=Math.floor(Number(menge));if(!Number.isFinite(menge)||menge<1||menge>offen){$('scanMsg').textContent='Ungültige Menge.';return}let old=Number(a.bestand)||0;if(old<menge){$('scanMsg').textContent='Nicht genügend Bestand: '+a.name;return}a.bestand=old-menge;line.issued=ausgegeben+menge;logs.unshift({datum:now(),user:'Handy',art:a.name,typ:'Ausgang VwSt',menge,alt:old,neu:a.bestand,grund:'Bestellung '+o.no+' / '+o.site});let fertig=o.items.every(x=>Number(x.issued||0)>=Number(x.qty||0));if(fertig){o.status='Erledigt';o.erledigtAm=now()}save();renderOpenOrders();$('result').innerHTML='<div class="msg"><b>✅ '+menge+' Stück ausgegeben</b><br>Artikel: '+esc(a.name)+'<br>VwSt: '+esc(o.site)+'<br>Bestand: '+a.bestand+(fertig?'<br><b>Bestellung vollständig erledigt.</b>':'<br>Restliche Positionen bleiben offen.')+'</div><button class="scan" style="margin-top:10px" onclick="newScan()">📷 Nächsten Barcode scannen</button>'}
function renderOpenOrders(){let open=orders.filter(o=>o.status!=='Erledigt');if(!open.length){$('openOrders').textContent='Keine offenen Bestellungen.';return}let h='';open.forEach(o=>{let names=o.items?.map(x=>{let a=articles.find(y=>y.id===x.articleId);return a?esc(a.name)+' × '+Number(x.qty):''}).filter(Boolean).join(', ')||'Keine Positionen';h+='<div class="order"><div class="row"><b>VwSt: '+esc(o.site)+'</b><span class="pill">Offen</span></div><div class="small muted">Bestellung '+esc(o.no||'-')+'</div><div style="margin-top:7px">'+names+'</div></div>'});$('openOrders').innerHTML=h}renderOpenOrders();function newScan(){$('result').classList.add('hidden');$('scanMsg').textContent='Bereit zum Scannen.';startScan()}function importData(){try{let d=JSON.parse($('dataBox').value);if(Array.isArray(d.articles))articles=d.articles;if(Array.isArray(d.orders))orders=d.orders;if(Array.isArray(d.logs))logs=d.logs;save();$('scanMsg').textContent='Lagerdaten übernommen.'}catch(e){$('scanMsg').textContent='JSON ist ungültig.'}}function exportData(){let b=new Blob([JSON.stringify({articles,orders,logs},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='LKV_Handy_Daten.json';a.click()}
</script></body></html>
