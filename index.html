<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b7a5a"><title>LKV Lager – Handy</title><script src="https://unpkg.com/@zxing/browser@0.1.5/umd/index.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f3f6f5;color:#17201d;font-family:Arial,sans-serif}main{max-width:560px;margin:auto;padding:14px}.top{padding:10px 4px}.top h1{margin:0;font-size:25px}.muted{color:#66736e}.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 3px 14px #0001}.scan{background:#0b7a5a;color:#fff;border:0;border-radius:16px;width:100%;padding:19px;font-size:18px;font-weight:700}.stop{background:#b42318}.video{width:100%;border-radius:16px;background:#111;display:none;aspect-ratio:4/3;object-fit:cover;margin-top:12px}.code{font-size:20px;font-weight:700;word-break:break-all}.order{border:2px solid #e3e8e5;border-radius:14px;padding:14px;margin-top:10px}.row{display:flex;justify-content:space-between;gap:10px;margin:6px 0}.pill{padding:5px 9px;border-radius:999px;background:#fff4d6;color:#8a5a00;font-weight:700;font-size:13px}.issue{width:100%;border:0;border-radius:13px;background:#0b7a5a;color:#fff;padding:14px;font-weight:700;font-size:16px;margin-top:10px}.msg{padding:12px;border-radius:12px;background:#eef2f0;margin-top:10px}.small{font-size:13px}.hidden{display:none!important}.settings{margin-top:18px}.settings textarea{width:100%;min-height:120px;margin-top:10px;border:1px solid #ccd5d1;border-radius:10px;padding:10px;font-family:monospace}.settings button{width:100%;padding:12px;margin-top:8px;border:0;border-radius:10px;background:#26332e;color:#fff}</style></head><body><main><div class="top"><h1>📦 LKV Lager</h1><div class="muted">Scannen → VwSt → ausgeben</div></div><div class="card"><button id="scanBtn" class="scan" onclick="startScan()">📷 Barcode scannen</button><button id="stopBtn" class="scan stop hidden" onclick="stopScan()">■ Scanner stoppen</button><video id="video" class="video" playsinline muted></video><div id="scanMsg" class="msg">Bereit zum Scannen.</div></div><div id="result" class="card hidden"></div><details class="settings"><summary>⚙️ Lagerdaten laden</summary><div class="small muted">Diese Handy-Seite speichert Daten lokal. Für einen gemeinsamen Bestand wird später eine zentrale Datenbank benötigt.</div><textarea id="dataBox" placeholder='JSON mit "articles" und "orders"'></textarea><button onclick="importData()">Daten übernehmen</button><button onclick="exportData()">Aktuelle Daten exportieren</button></details></main><script>
const AKEY='lkv_v2_articles',OKEY='lkv_v2_orders',LKEY='lkv_v2_logs';let articles=JSON.parse(localStorage.getItem(AKEY)||'[]'),orders=JSON.parse(localStorage.getItem(OKEY)||'[]'),logs=JSON.parse(localStorage.getItem(LKEY)||'[]'),reader=null,stream=null;
const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const now=()=>new Date().toLocaleString('de-DE');function save(){localStorage.setItem(AKEY,JSON.stringify(articles));localStorage.setItem(OKEY,JSON.stringify(orders));localStorage.setItem(LKEY,JSON.stringify(logs))}
async function startScan(){if(!window.ZXing)return $('scanMsg').textContent='Scanner konnte nicht geladen werden.';try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});$('video').srcObject=stream;await $('video').play();$('video').style.display='block';$('scanBtn').classList.add('hidden');$('stopBtn').classList.remove('hidden');$('scanMsg').textContent='Barcode vor die Kamera halten …';reader=new ZXing.BrowserMultiFormatReader();reader.decodeFromVideoElement($('video'),(r)=>{if(r){showOrders(r.getText());stopScan()}})}catch(e){$('scanMsg').textContent='Kamera nicht verfügbar. Kamerazugriff erlauben und HTTPS verwenden.'}}
function stopScan(){try{reader?.reset()}catch(e){}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('video').pause();$('video').srcObject=null;$('video').style.display='none';$('scanBtn').classList.remove('hidden');$('stopBtn').classList.add('hidden')}
function showOrders(code){let found=orders.filter(o=>o.status!=='Erledigt'&&o.items?.some(x=>{let a=articles.find(y=>y.id===x.articleId);return a&&(String(a.barcode)===String(code)||String(a.nr)===String(code))}));$('result').classList.remove('hidden');if(!found.length){$('result').innerHTML='<b>Keine offene Bestellung gefunden.</b><div class="msg">Barcode: <span class="code">'+esc(code)+'</span></div>';return}let h='<div class="muted">Gescannt</div><div class="code">'+esc(code)+'</div><h2>📋 Welche VwSt hat bestellt?</h2><div class="small muted">'+found.length+' offene Bestellung(en) gefunden</div>';found.forEach(o=>{let items=o.items.map(x=>{let a=articles.find(y=>y.id===x.articleId);return a?'<div class="row"><span>'+esc(a.name)+'<br><span class="small muted">'+esc(a.nr||'')+'</span></span><b>'+Number(x.qty)+' Stk.</b></div>':''}).join('');h+='<div class="order"><div class="row"><b>VwSt: '+esc(o.site)+'</b><span class="pill">Offen</span></div><div class="small muted">Bestellung '+esc(o.no||'-')+' · '+esc(o.date||'')+'</div>'+items+'<button class="issue" onclick="fulfill('+o.id+')">📦 Diese Bestellung aus Lager ausgeben</button></div>'});$('result').innerHTML=h}
function fulfill(id){let o=orders.find(x=>x.id===id);if(!o||o.status==='Erledigt')return;let missing=[];for(let x of o.items){let a=articles.find(y=>y.id===x.articleId);if(!a||Number(a.bestand)<Number(x.qty))missing.push(a?.name||'Artikel')}if(missing.length){$('scanMsg').textContent='Nicht genügend Bestand: '+missing.join(', ');return}o.items.forEach(x=>{let a=articles.find(y=>y.id===x.articleId),q=Number(x.qty)||0,old=Number(a.bestand)||0;a.bestand=old-q;logs.unshift({datum:now(),user:'Handy',art:a.name,typ:'Ausgang VwSt',menge:q,alt:old,neu:a.bestand,grund:'Bestellung '+o.no+' / '+o.site})});o.status='Erledigt';o.erledigtAm=now();save();$('result').innerHTML='<div class="msg"><b>✅ Bestellung erledigt</b><br>VwSt: '+esc(o.site)+'<br>Bestellung: '+esc(o.no||'-')+'<br>Bestand automatisch reduziert.</div><button class="scan" style="margin-top:10px" onclick="newScan()">📷 Nächsten Barcode scannen</button>'}
function newScan(){$('result').classList.add('hidden');$('scanMsg').textContent='Bereit zum Scannen.';startScan()}function importData(){try{let d=JSON.parse($('dataBox').value);if(Array.isArray(d.articles))articles=d.articles;if(Array.isArray(d.orders))orders=d.orders;if(Array.isArray(d.logs))logs=d.logs;save();$('scanMsg').textContent='Lagerdaten übernommen.'}catch(e){$('scanMsg').textContent='JSON ist ungültig.'}}function exportData(){let b=new Blob([JSON.stringify({articles,orders,logs},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='LKV_Handy_Daten.json';a.click()}
</script></body></html>
