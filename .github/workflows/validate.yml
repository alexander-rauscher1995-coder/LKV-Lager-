name: Validate Fitness Coach

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required files
        run: |
          test -f index.html
          test -f manifest.json
          test -f sw.js
          test -f icon.svg
          test -f cloud/API.md
          test -f cloud/README.md
          test -f cloud/sync-adapter.js
          test -f cloud/config.example.js
          test -f cloud/snapshot.js
          test -f cloud/ACTIVATION.md
          test -f cloud/PRODUCTION.md
          test -f api/health.js
          test -f api/README.md
          test -f api/_lib/sync.js
          test -f api/_lib/persistence.js
          test -f api/v1/sync.js
          test -f api/v1/sync/changes.js
          test -f apple/integration.json
          test -f ios/FitnessCoachApp.swift
          test -f ios/HealthKitManager.swift
          test -f ios/WatchConnectivityManager.swift
          test -f watchOS/FitnessCoachWatchApp.swift
          test -f watchOS/FitnessCoachWorkoutManager.swift
          test -f watchOS/FitnessCoachWatchConnectivity.swift
          test -f tests/sync.test.js
          test -f tests/snapshot.test.js
          test -f package.json

      - name: Validate HTML structure
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          s = Path("index.html").read_text(encoding="utf-8")
          checks = {
              "<html": "<html" in s.lower(),
              "</html>": "</html>" in s.lower(),
              "<script>": s.lower().count("<script"),
              "</script>": s.lower().count("</script>"),
              "<style>": s.lower().count("<style"),
              "</style>": s.lower().count("</style>"),
              "V149": "V149" in s,
              "release audit": "runReleaseAudit" in s,
              "backup schema": "validateBackupPayload" in s,
              "cloud status": "fitnessCloudStatus" in s,
          }
          assert checks["<html"] and checks["</html>"]
          assert checks["<script>"] == checks["</script>"]
          assert checks["<style>"] == checks["</style>"]
          assert checks["V149"]
          assert checks["release audit"]
          assert checks["backup schema"]
          assert checks["cloud status"]
          json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          print(checks)
          PY

      - name: Install test dependencies
        run: npm install --ignore-scripts

      - name: Run cloud integration tests
        run: npm test

      - name: Validate JavaScript syntax
        run: |
          node --check cloud/sync-adapter.js
          node --check cloud/snapshot.js
          node --check sw.js
          node --check api/health.js
          node --check api/_lib/sync.js
          node --check api/_lib/persistence.js
          node --check api/v1/sync.js
          node --check api/v1/sync/changes.js

      - name: Validate cloud layer
        run: |
          grep -q "FITNESS_CLOUD_CONFIG" cloud/sync-adapter.js
          grep -q "fitness_cloud_sync_queue_v1" cloud/sync-adapter.js
          grep -q "status:'queued'" cloud/sync-adapter.js
          grep -q "v1/sync" cloud/API.md
          grep -q "backend-required" apple/integration.json
          grep -q "enabled:false" cloud/config.example.js
          grep -q "schemaVersion" cloud/snapshot.js
          grep -q "fitness-coach-v6" sw.js

      - name: Validate native integration markers
        run: |
          grep -q "HealthKit" ios/HealthKitManager.swift
          grep -q "WCSession" ios/WatchConnectivityManager.swift
          grep -q "HKWorkoutSession" watchOS/FitnessCoachWorkoutManager.swift
          grep -q "incomingCommand" watchOS/FitnessCoachWatchConnectivity.swift
          grep -q "requireAuth" api/v1/sync.js
          grep -q "validateSnapshot" api/v1/sync.js
          grep -q "RS256" api/_lib/sync.js
          grep -q "FITNESS_AUTH_ISSUER" api/_lib/sync.js
          grep -q "FITNESS_AUTH_AUDIENCE" api/_lib/sync.js
          grep -q "FITNESS_JWT_PUBLIC_KEY" api/_lib/sync.js
          grep -q "FITNESS_DATABASE_URL" api/_lib/persistence.js
          grep -q "fitness_snapshots" api/_lib/persistence.js
          grep -q "revision-conflict" api/_lib/persistence.js
          grep -q "payload.sub" api/_lib/sync.js
