<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FITLIFE Login</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#f5f3ff,#f8f9fc);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;color:#171827}.card{width:min(390px,calc(100% - 32px));background:#fff;border:1px solid #e7e9f0;border-radius:24px;padding:30px;box-shadow:0 24px 70px #23243722}.logo{display:flex;gap:10px;align-items:center}.mark{width:38px;height:38px;border-radius:11px;background:#7047e8;color:#fff;display:grid;place-items:center;font-weight:900}.logo b{display:block;letter-spacing:.12em}.logo small{color:#8d93a4}.card h1{margin:25px 0 8px;font-size:28px}.card p{color:#7c8395;font-size:13px;line-height:1.5}.field{margin-top:14px}.field label{display:block;font-size:11px;font-weight:800;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #dfe2eb;border-radius:11px;outline:none}.btn{width:100%;border:0;border-radius:11px;padding:13px;margin-top:16px;background:#7047e8;color:#fff;font-weight:800}.demo{margin-top:9px;background:#f5f1ff;color:#6840da;border:1px solid #e1dafa}.error{height:18px;color:#c43d55;font-size:11px;margin-top:9px}.note{font-size:10px;color:#9aa0b0;text-align:center;margin-top:16px}</style></head><body><main class="card"><div class="logo"><div class="mark">✚</div><div><b>FITLIFE</b><small>Stronger Together</small></div></div><h1>Willkommen zurück</h1><p>Melde dich an, um die FITLIFE-Demo zu öffnen.</p><div class="field"><label>E-Mail</label><input id="e" type="email" value="demo@fitlife.de"></div><div class="field"><label>Passwort</label><input id="p" type="password" value="fitlife123"></div><button class="btn" onclick="login()">Anmelden</button><button class="btn demo" onclick="login()">Demo-Zugang verwenden</button><div id="err" class="error"></div><div class="note">Demo-Zugang · demo@fitlife.de · fitlife123<br>Die Anmeldung wird nur lokal im Browser gespeichert.</div></main><script>function login(){if(e.value.trim().toLowerCase()==='demo@fitlife.de'&&p.value==='fitlife123'){localStorage.setItem('fitlife_demo_session','1');location.href='./'}else err.textContent='Demo-Zugang: demo@fitlife.de / fitlife123'}</script></body></html>
